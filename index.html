<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.55}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:700;min-height:44px}button:focus,input:focus,select:focus,textarea:focus{outline:3px solid #d6a9ef;outline-offset:2px}.primary{background:var(--purple);color:white}.soft{background:var(--pink);color:var(--purple)}.white{background:white;color:var(--purple);border:1px solid var(--line)}.danger{background:#fff0f2;color:var(--red);border:1px solid #f1c7ce}.small{font-size:14px}.top{position:sticky;top:0;z-index:5;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px clamp(14px,4vw,50px);gap:12px}.brand{display:flex;align-items:center;gap:10px;color:var(--purple);font-size:21px;font-weight:900}.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--purple),#b74d91);display:grid;place-items:center;color:white;font-size:23px}.nav{display:flex;gap:3px;flex-wrap:wrap}.nav button{background:transparent;color:#62556b;padding:9px 12px;font-size:15px}.nav button.active,.nav button:hover{background:var(--pink);color:var(--purple)}.right{display:flex;align-items:center;gap:8px}.wrap{max-width:1150px;margin:auto;padding:28px 20px}.hero{background:linear-gradient(125deg,#4c1b61,#784092 68%,#a44c86);color:white;border-radius:26px;padding:clamp(25px,5vw,55px);display:grid;grid-template-columns:1.4fr .6fr;align-items:center;gap:20px;overflow:hidden}.hero h1{font-size:clamp(32px,4.5vw,52px);line-height:1.12;margin:14px 0}.hero p{max-width:650px;color:#f5eaf8}.hero .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#ffe3a3}.heroArt{font-size:115px;text-align:center;filter:drop-shadow(0 10px 10px #2c0d3b66)}.section{margin:30px 0}.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:16px}.sectionHead h2{margin:0;font-size:27px;color:var(--purple)}.sectionHead p{margin:4px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.card h3{margin:8px 0;color:var(--purple);font-size:20px}.card p{color:var(--muted);font-size:15px}.ico{width:48px;height:48px;border-radius:14px;background:var(--pink);display:grid;place-items:center;font-size:26px}.pill{display:inline-block;background:#f1e7f7;color:var(--purple);padding:4px 9px;border-radius:30px;font-size:12px;font-weight:800}.green{background:#e5f5eb;color:var(--green)}.gold{background:#fff3d5;color:#805c00}.pageTitle{font-size:34px;color:var(--purple);margin:0 0 5px}.lead{color:var(--muted);margin:0 0 22px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.toolbar input{flex:1;min-width:220px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-weight:700;font-size:15px}.input,textarea,select{width:100%;border:1px solid #d9cddd;background:white;border-radius:11px;padding:12px;color:var(--ink);min-height:46px}textarea{min-height:105px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{background:#fff7df;border:1px solid #f0d99c;color:#674d12;border-radius:13px;padding:14px;margin:15px 0;font-size:14px}.safe{background:#eaf7ef;border:1px solid #b9e1ca;color:#1b6141;border-radius:13px;padding:14px;margin:15px 0}.list{display:grid;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;gap:15px;background:white;border:1px solid var(--line);border-radius:12px;padding:13px}.item p{margin:3px 0;color:var(--muted);font-size:14px}.empty{text-align:center;padding:35px;color:var(--muted)}.footer{background:#32153e;color:#ead9f0;padding:25px 5vw;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:14px}.footer strong{color:white}.modalbg{position:fixed;inset:0;background:#1d0c2a99;z-index:20;display:grid;place-items:center;padding:16px}.modal{background:white;border-radius:20px;max-width:600px;width:100%;padding:25px;max-height:90vh;overflow:auto}.modal h2{color:var(--purple);margin-top:0}.modalfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c1738;color:white;padding:14px 20px;border-radius:12px;z-index:30;box-shadow:var(--shadow);max-width:90%;text-align:center}.hidden{display:none!important}.bigText{font-size:20px}.quickExit{background:#fff0f2;color:#a5213d;border:1px solid #e9b9c3;font-size:13px;padding:8px 10px}.auth{min-height:calc(100vh - 150px);display:grid;place-items:center;padding:28px 16px;background:radial-gradient(circle at top right,#f3e5f8,transparent 45%)}.authbox{width:min(100%,520px);background:white;border:1px solid var(--line);border-radius:24px;padding:clamp(22px,5vw,38px);box-shadow:0 20px 60px #40175b1a}.authbox h1{color:var(--purple);margin:8px 0}.authbox .brand{margin-bottom:15px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.step{padding:6px 10px;border-radius:20px;background:#f3edf5;color:#75647b;font-size:13px}.step.active{background:var(--purple);color:white}.result{background:#f5eef8;border-radius:14px;padding:15px;margin-top:14px;color:var(--purple)}.progress{height:10px;background:#eee3f1;border-radius:20px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,#744091,#ca5b9c);width:0}.voice{font-size:13px;background:#e9f7ef;color:#1a7049}
@media(max-width:850px){.nav{display:none}.hero{grid-template-columns:1fr}.heroArt{display:none}.grid{grid-template-columns:repeat(2,1fr)}.top{flex-wrap:wrap}.right{margin-left:auto}}
@media(max-width:560px){.grid,.formgrid{grid-template-columns:1fr}.wrap{padding:22px 14px}.pageTitle{font-size:29px}.hero h1{font-size:34px}.right .white{display:none}}

.heroArt{position:relative;min-height:300px;display:flex;align-items:center;justify-content:center;filter:none}
.heroArt img{width:min(100%,330px);height:330px;object-fit:cover;object-position:center 35%;border-radius:48% 48% 28px 28px;border:6px solid #ffffff35;box-shadow:0 18px 45px #2c0d3b55}
.heroBadge{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:var(--purple);padding:10px 15px;border-radius:999px;font-size:14px;font-weight:800;box-shadow:0 8px 22px #2c0d3b30}
@media(max-width:720px){.hero{grid-template-columns:1fr}.heroArt{min-height:210px}.heroArt img{height:220px;width:220px}.heroBadge{bottom:0}}
.profilePhoto{width:64px;height:64px;object-fit:cover;border-radius:50%;border:3px solid var(--pink)}

.locationPanel{background:linear-gradient(135deg,#f5edf9,#fff);border:1px solid var(--line);border-radius:20px;padding:22px;margin:20px 0}
.locationResult{background:#eaf7ef;border:1px solid #b9e1ca;color:#1b6141;border-radius:12px;padding:14px;overflow-wrap:anywhere}
.locationActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

</style>

<body>
<header class="top"><div class="brand"><div class="mark">✦</div> SHAKTI SHIELD</div><nav class="nav" id="nav"></nav><div class="right"><select id="lang" class="input" style="width:auto;padding:8px" aria-label="Language"><option value="en">English</option><option value="te">తెలుగు</option><option value="hi">हिंदी</option></select><button class="white" id="accountBtn" onclick="go('account')">My account</button><button class="quickExit" onclick="quickExit()" title="Quickly switch to a neutral screen">Quick exit ✕</button></div></header>
<main id="app"></main><footer class="footer"><div><strong>✦ SHAKTI SHIELD</strong><br>Your business. Your strength. Your choices.</div><div>Designed for simple, safe and inclusive access.<br><span style="opacity:.7">Demo mode · Sample listings only · No real emergency dispatch</span></div><div>Privacy first · Respectful community</div></footer><div id="modal"></div>
<script>
'use strict';
const T={en:{home:'Home',discover:'Find support',grow:'Grow my business',mentors:'Mentors',money:'Money basics',community:'Community',welcome:'Your business matters. Your dreams matter.',subtitle:'Easy support for women who want to start, run or grow a business. No difficult words. One step at a time.',find:'Find help',start:'Start my business plan',hello:'Welcome'},te:{home:'హోమ్',discover:'సహాయం వెతకండి',grow:'నా వ్యాపారాన్ని పెంచండి',mentors:'మెంటర్లు',money:'డబ్బు విషయాలు',community:'కమ్యూనిటీ',welcome:'మీ వ్యాపారం ముఖ్యం. మీ కలలు ముఖ్యం.',subtitle:'వ్యాపారం ప్రారంభించడానికి, నిర్వహించడానికి లేదా పెంచడానికి సులభమైన సహాయం. ఒక్కో అడుగు.',find:'సహాయం కనుగొనండి',start:'నా వ్యాపార ప్రణాళిక ప్రారంభించండి',hello:'స్వాగతం'},hi:{home:'होम',discover:'मदद खोजें',grow:'मेरा व्यवसाय बढ़ाएँ',mentors:'मेंटर',money:'पैसों की जानकारी',community:'समुदाय',welcome:'आपका व्यवसाय महत्वपूर्ण है। आपके सपने महत्वपूर्ण हैं।',subtitle:'व्यवसाय शुरू करने, चलाने या बढ़ाने के लिए आसान सहायता। एक कदम एक समय पर।',find:'मदद खोजें',start:'मेरी व्यवसाय योजना शुरू करें',hello:'स्वागत है'}};
const resources=[
{cat:'Registration',icon:'🧾',name:'Register my small business',simple:'Learn what business registration may be needed and where to ask for official help.',detail:'Start with your business type, location and size. Requirements differ. Use official government portals and do not pay unofficial agents.',link:'https://udyamregistration.gov.in/'},
{cat:'Money',icon:'💰',name:'Understand loans and money',simple:'Learn about savings, loans, interest and repayment in simple steps.',detail:'Compare total repayment, interest, fees and due dates. Never share your OTP or PIN. Ask a trusted advisor if anything is unclear.',link:'https://www.msme.gov.in/'},
{cat:'Mentoring',icon:'🌱',name:'Talk to a business mentor',simple:'Get guidance about pricing, customers, confidence and planning.',detail:'A mentor can help you think through options. Do not share passwords, OTPs or private financial details.'},
{cat:'Marketing',icon:'📣',name:'Find more customers',simple:'Explore ways to tell people about your products and reach new customers.',detail:'Try clear product photos, word-of-mouth, local groups and a simple digital catalogue. Ask customers what they need.'},
{cat:'Legal',icon:'⚖️',name:'Ask a legal support question',simple:'Find guidance about business rules, contracts and rights.',detail:'This prototype cannot provide legal advice. Contact a qualified professional or official service for your situation.'},
{cat:'Safety',icon:'🛡️',name:'Safety and emergency help',simple:'Find safety information and prepare a plan for yourself and your business.',detail:'If you are in immediate danger in India, call 112. Women’s helpline 181 may be available depending on state. This prototype is not an emergency service.'},
{cat:'Skills',icon:'📱',name:'Learn digital skills',simple:'Learn how to use a smartphone, digital payments and online selling safely.',detail:'Start with one skill. Never share OTPs or passwords. Verify payment messages in your own bank app.'},
{cat:'Government',icon:'🏛️',name:'Explore government schemes',simple:'Find official information about schemes that may support your business.',detail:'Scheme eligibility changes. Read requirements on official sites and beware of people promising guaranteed loans.',link:'https://www.india.gov.in/'},
];
const mentors=[{name:'Ananya',area:'Sales & business planning',desc:'Helps small shops understand customers, pricing and growth.'},{name:'Farah',area:'Savings & money management',desc:'Explains cash flow, budgeting and loan questions in simple terms.'},{name:'Meera',area:'Online selling & digital skills',desc:'Helps create a simple digital catalogue and reach customers.'}];
let page='login',user=null,lang='en',largeText=false;
const $=id=>document.getElementById(id);const tr=k=>(T[lang]||T.en)[k]||T.en[k];
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(s){let x=document.createElement('div');x.className='toast';x.textContent=s;document.body.append(x);setTimeout(()=>x.remove(),3000)}
function save(k,v){localStorage.setItem('ss2_'+k,JSON.stringify(v))}function read(k,d=[]){try{return JSON.parse(localStorage.getItem('ss2_'+k))??d}catch{return d}}
function go(p){if(!user&&p!=='login'&&p!=='signup'){page='login';render();toast('Please sign in to keep your workspace private on this device.');return}page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function renderNav(){let items=[['home',tr('home')],['discover',tr('discover')],['location','📍 Location safety'],['grow',tr('grow')],['mentors',tr('mentors')],['money',tr('money')],['community',tr('community')]];$('nav').innerHTML=items.map(([id,n])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('')}
function render(){renderNav();document.body.classList.toggle('bigText',largeText);$('accountBtn').textContent=user?(user.name||'My account'):'Sign in';let a=$('app');if(page==='login'||page==='signup')a.innerHTML=authPage(page);else if(page==='home')a.innerHTML=homePage();else if(page==='discover')a.innerHTML=discoverPage();else if(page==='location')a.innerHTML=locationPage();else if(page==='grow')a.innerHTML=growPage();else if(page==='mentors')a.innerHTML=mentorPage();else if(page==='money')a.innerHTML=moneyPage();else if(page==='community')a.innerHTML=communityPage();else if(page==='account')a.innerHTML=accountPage();else a.innerHTML=homePage();bindPage();}
function authPage(which){return `<section class="auth"><div class="authbox"><div class="brand"><div class="mark">✦</div> SHAKTI SHIELD</div><span class="pill">A safe place to take your next step</span><h1>${which==='login'?'Welcome back':'Let’s get started'}</h1><p class="lead">${which==='login'?'Sign in to open your personal business space.':'Create your account. You can use simple words—no business experience needed.'}</p><div class="notice">🔒 <b>Prototype privacy:</b> Your account is protected by server-side password hashing and a private session. Never share your password or OTP.</div><form id="authForm"><div class="field"><label>Your name</label><input class="input" name="name" autocomplete="name" placeholder="What should we call you?" ${which==='signup'?'required':''}/></div><div class="field"><label>Phone or email</label><input class="input" name="identity" autocomplete="username" required placeholder="Your phone number or email"/></div><div class="field"><label>${which==='login'?'Password':'Create a password'}</label><input class="input" name="password" type="password" minlength="8" autocomplete="${which==='login'?'current-password':'new-password'}" required placeholder="Use at least 8 characters"/></div>${which==='signup'?'<label style="display:flex;gap:9px;align-items:flex-start;font-size:14px"><input type="checkbox" required style="margin-top:5px"> I understand this is a prototype and will not enter sensitive information.</label>':''}<button class="primary" style="width:100%;margin-top:14px">${which==='login'?'Sign in securely':'Create my account'}</button></form><p style="text-align:center;margin:16px 0">${which==='login'?'New here?':'Already have an account?'} <button class="soft" onclick="page='${which==='login'?'signup':'login'}';render()">${which==='login'?'Create account':'Sign in'}</button></p><p class="small" style="text-align:center;color:var(--muted)">Simple language · Privacy choices · Women-first support</p></div></section>`}

function locationPage(){return `<div class="wrap"><h1 class="pageTitle">📍 Location safety</h1>
<p class="lead">Use your device location only when you choose. Shakti Shield does not continuously track you.</p>
<div class="locationPanel"><h2>Share your current location safely</h2>
<p>Get your location from your browser, then choose whether to copy it or share it with someone you trust. Your browser will ask permission first.</p>
<div id="locationStatus" class="notice" aria-live="polite">Location has not been requested.</div>
<div class="locationActions"><button class="primary" onclick="getSafeLocation()">📍 Get my location</button>
<button class="white" onclick="clearSafeLocation()">Clear location</button></div>
<div id="locationResult" style="margin-top:12px"></div></div>
<div class="grid">
<div class="card"><div class="ico">☎️</div><h3>Emergency help in India</h3><p>Call <b>112</b> for emergency assistance. Women’s helpline <b>181</b> availability may vary by state.</p><p class="small">This website does not contact emergency services for you.</p></div>
<div class="card"><div class="ico">🧭</div><h3>Meet safely</h3><p>Choose a public place, arrange your own transport, and tell a trusted person where you are going.</p></div>
<div class="card"><div class="ico">🔐</div><h3>Protect your privacy</h3><p>Only share your location with someone you trust. Do not post your live location publicly.</p></div>
</div></div>`}
let safeLocation=null;
function getSafeLocation(){
 const status=$('locationStatus'),result=$('locationResult');
 if(!navigator.geolocation){status.textContent='Location is not supported by this browser. Try a current version of Chrome.';return}
 status.textContent='Waiting for your permission…';
 navigator.geolocation.getCurrentPosition(pos=>{
   safeLocation={lat:pos.coords.latitude,lon:pos.coords.longitude};
   const mapUrl=`https://maps.google.com/?q=${safeLocation.lat},${safeLocation.lon}`;
   status.textContent='Location received. It has not been sent to Shakti Shield.';
   result.innerHTML=`<div class="locationResult"><b>Your current location</b><br>Coordinates: ${safeLocation.lat.toFixed(5)}, ${safeLocation.lon.toFixed(5)}<br><a href="${mapUrl}" target="_blank" rel="noopener">Open location in map</a><div class="locationActions"><button class="soft" onclick="copySafeLocation()">Copy location link</button><button class="white" onclick="shareSafeLocation()">Share with trusted person</button></div></div>`;
 },err=>{
   const messages={1:'Location permission was denied. Allow location access in your browser settings if you want to use it.',2:'Your location could not be determined. Try again in an open area.',3:'Location request timed out. Please try again.'};
   status.textContent=messages[err.code]||'Could not access location. Please try again.';
 },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function copySafeLocation(){
 if(!safeLocation){toast('Get your location first.');return}
 const link=`https://maps.google.com/?q=${safeLocation.lat},${safeLocation.lon}`;
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(()=>toast('Location link copied. Share it only with someone you trust.')).catch(()=>toast(link));
 else toast(link);
}
function shareSafeLocation(){
 if(!safeLocation){toast('Get your location first.');return}
 const link=`https://maps.google.com/?q=${safeLocation.lat},${safeLocation.lon}`;
 if(navigator.share)navigator.share({title:'My location',text:'My current location — please keep it private.',url:link}).catch(()=>{});
 else copySafeLocation();
}
function clearSafeLocation(){safeLocation=null;if($('locationStatus'))$('locationStatus').textContent='Location cleared from this page.';if($('locationResult'))$('locationResult').innerHTML='';}

function homePage(){return `<div class="wrap"><section class="hero"><div><div class="eyebrow">✦ Together, we grow stronger</div><h1>${tr('welcome')}</h1><p>${tr('subtitle')}</p><div class="actions"><button class="white" onclick="go('discover')">${tr('find')} →</button><button class="soft" onclick="go('grow')">${tr('start')} →</button></div></div><div class="heroArt" aria-label="Women supporting women">
<img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=720&q=85" alt="Confident woman entrepreneur" loading="eager">
<div class="heroBadge">Women supporting women ✨</div>
</div></section><div class="section"><div class="sectionHead"><div><h2>What would you like to do?</h2><p>Choose a picture. We will guide you step by step.</p></div><button class="white" onclick="toggleText()">🔎 Make words bigger</button></div><div class="grid"><div class="card"><div class="ico">🛍️</div><h3>Show my products</h3><p>Make a simple plan to show your products to more people.</p><button class="soft" onclick="go('grow')">Start here →</button></div><div class="card"><div class="ico">🧭</div><h3>Find help near me / online</h3><p>Explore learning, legal, finance and government support.</p><button class="soft" onclick="go('discover')">Find support →</button></div><div class="card"><div class="ico">🤝</div><h3>Talk to a mentor</h3><p>Ask someone experienced to guide your business journey.</p><button class="soft" onclick="go('mentors')">Meet mentors →</button></div><div class="card"><div class="ico">💵</div><h3>Understand my money</h3><p>Calculate simple costs, selling price and possible profit.</p><button class="soft" onclick="go('money')">Open calculator →</button></div><div class="card"><div class="ico">🛡️</div><h3>My safety</h3><p>Learn safety tips and prepare emergency contacts.</p><button class="soft" onclick="safetyModal()">Open safety →</button></div><div class="card"><div class="ico">💬</div><h3>Learn with other women</h3><p>Share ideas in a respectful community. You control what you share.</p><button class="soft" onclick="go('community')">Join community →</button></div></div><div class="safe"><b>Remember:</b> You do not need to know everything today. Start with one small step. Your information belongs to you.</div></div>`}
function discoverPage(){return `<div class="wrap"><h1 class="pageTitle">${tr('discover')}</h1><p class="lead">Use everyday words to search. Tap “Read more” to understand what each support service does.</p><div class="toolbar"><input class="input" id="resSearch" placeholder="Try: loan, sell online, training, safety…"/><select class="input" id="resCat" style="max-width:200px"><option>All support</option>${['Registration','Money','Mentoring','Marketing','Legal','Safety','Skills','Government'].map(x=>`<option>${x}</option>`).join('')}</select><button class="white" onclick="$('resSearch').value='';$('resCat').value='All support';filterRes()">Clear</button></div><div id="resList" class="grid">${resourceCards(resources)}</div><div class="notice">⚠️ We are showing learning examples. Before launch, the team must verify real organizations, phone numbers, locations and eligibility. Never pay a person who promises guaranteed benefits.</div></div>`}
function resourceCards(arr){return arr.length?arr.map((r,i)=>`<article class="card"><div class="ico">${r.icon}</div><span class="pill">${r.cat}</span><h3>${r.name}</h3><p>${r.simple}</p><button class="soft" onclick="resourceDetail(${resources.indexOf(r)})">Read more / వివరాలు →</button></article>`).join(''):'<div class="empty">No results found. Try another word.</div>'}
function filterRes(){let q=$('resSearch').value.toLowerCase(),c=$('resCat').value;let arr=resources.filter(r=>(c==='All support'||r.cat===c)&&`${r.name} ${r.simple} ${r.cat}`.toLowerCase().includes(q));$('resList').innerHTML=resourceCards(arr)}
function resourceDetail(i){let r=resources[i];modal(`<div class="ico">${r.icon}</div><h2>${r.name}</h2><p>${r.detail}</p>${r.link?`<p><b>Official website:</b><br><a href="${r.link}" target="_blank" rel="noopener">Open official site ↗</a></p>`:''}<div class="notice">Before sharing details, check that this service is real and right for you. Never share OTP, PIN or password.</div>`,'Close')}
function growPage(){let d=read('business',{});return `<div class="wrap"><h1 class="pageTitle">${tr('grow')}</h1><p class="lead">We will make a simple business growth plan together. You can write, select or speak (if your browser supports it).</p><div class="steps"><span class="step active">1. My idea</span><span class="step">2. My customers</span><span class="step">3. My price</span><span class="step">4. My next steps</span></div><div class="progress"><div id="growProgress"></div></div><form class="card" id="businessForm" style="margin-top:18px"><div id="growFields"></div><div class="modalfoot" style="justify-content:space-between"><button type="button" class="white" id="prevStep">← Back</button><button class="primary" id="nextStep">Next step →</button></div></form><div class="safe">Your plan stays in this browser in this demo. You can delete it from My account. Do not add confidential customer details.</div></div>`}
let growStep=0;const growData={idea:'',customer:'',need:'',price:'',cost:'',place:'',action:''};
function renderGrowStep(){let f=$('growFields');if(!f)return;let content='';if(growStep===0)content=`<h2>Step 1: Tell us about your business</h2><p class="lead">What do you make, sell or want to do?</p><div class="field"><label>My business idea (simple words)</label><textarea id="gIdea" placeholder="Example: I make pickles at home…">${esc(growData.idea)}</textarea><button type="button" class="voice" onclick="voiceFill('gIdea')">🎙️ Speak instead (if supported)</button></div><div class="field"><label>Where do you work?</label><input class="input" id="gPlace" placeholder="Village, town or online" value="${esc(growData.place)}"></div>`;
if(growStep===1)content=`<h2>Step 2: Who may buy from you?</h2><p class="lead">Think about people who need or enjoy what you sell.</p><div class="field"><label>My customers may be…</label><textarea id="gCustomer" placeholder="Example: neighbours, office workers, families…">${esc(growData.customer)}</textarea><button type="button" class="voice" onclick="voiceFill('gCustomer')">🎙️ Speak instead</button></div><div class="field"><label>What problem do I help them solve?</label><textarea id="gNeed" placeholder="Example: They need tasty homemade snacks…">${esc(growData.need)}</textarea></div>`;
if(growStep===2)content=`<h2>Step 3: Understand my price</h2><p class="lead">It is okay if you do not know yet. Estimate first.</p><div class="formgrid"><div class="field"><label>Cost to make one item (₹)</label><input class="input" type="number" min="0" id="gCost" value="${esc(growData.cost)}" placeholder="Ingredients + work + packing"></div><div class="field"><label>Price I may charge (₹)</label><input class="input" type="number" min="0" id="gPrice" value="${esc(growData.price)}" placeholder="What customer pays"></div></div><div class="notice">Remember to include materials, time, travel, packaging and other costs. This is only a simple estimate.</div>`;
if(growStep===3)content=`<h2>Step 4: My next small step</h2><p class="lead">Big dreams become easier with small steps.</p><div class="field"><label>One thing I will do this week</label><textarea id="gAction" placeholder="Example: Ask 5 people what product they like…">${esc(growData.action)}</textarea><button type="button" class="voice" onclick="voiceFill('gAction')">🎙️ Speak instead</button></div><div class="safe">You have done a great job! Save your plan and see it in My account.</div>`;
f.innerHTML=content;$('prevStep').disabled=growStep===0;$('prevStep').style.opacity=growStep===0?.5:1;$('nextStep').textContent=growStep===3?'Save my plan ✓':'Next step →';$('growProgress').style.width=((growStep+1)*25)+'%';}
function collectGrow(){if(growStep===0){growData.idea=$('gIdea').value;growData.place=$('gPlace').value}if(growStep===1){growData.customer=$('gCustomer').value;growData.need=$('gNeed').value}if(growStep===2){growData.cost=$('gCost').value;growData.price=$('gPrice').value}if(growStep===3)growData.action=$('gAction').value;save('business',growData)}
function mentorPage(){return `<div class="wrap"><h1 class="pageTitle">${tr('mentors')}</h1><p class="lead">Mentors are people who can share experience. Choose a topic and ask for a call. These are sample profiles.</p><div class="grid">${mentors.map((m,i)=>`<div class="card"><div class="ico">👩🏽‍💼</div><h3>${m.name}</h3><span class="pill">${m.area}</span><p>${m.desc}</p><button class="primary" onclick="mentorRequest(${i})">Ask for a call</button></div>`).join('')}</div><div class="notice">A real service must check mentor identity, protect messages, get consent and let users block/report anyone.</div></div>`}
function mentorRequest(i){let m=mentors[i];modal(`<h2>Ask ${m.name} for guidance</h2><form id="mentorForm"><div class="field"><label>Your name (or nickname)</label><input class="input" name="name" required></div><div class="field"><label>What would you like help with?</label><select class="input" name="topic"><option>Finding customers</option><option>Pricing my product</option><option>Managing money</option><option>Using a smartphone for business</option><option>Other business question</option></select></div><div class="field"><label>Best way to contact you (optional)</label><input class="input" name="contact" placeholder="Do not enter sensitive information"></div><button class="primary">Send demo request</button></form>`);$('mentorForm').onsubmit=e=>{e.preventDefault();let r=read('requests',[]);r.push({...Object.fromEntries(new FormData(e.target)),mentor:m.name,date:new Date().toLocaleDateString()});save('requests',r);closeModal();toast('Request saved on this device (demo).')};}
function moneyPage(){return `<div class="wrap"><h1 class="pageTitle">${tr('money')}</h1><p class="lead">Let’s see how much you spend and earn. You can use round numbers.</p><div class="card" style="max-width:760px"><h2>Simple profit calculator</h2><form id="moneyForm"><div class="formgrid"><div class="field"><label>How much does one product cost you? (₹)</label><input class="input" type="number" min="0" id="cost" value="20" required></div><div class="field"><label>How much do you sell it for? (₹)</label><input class="input" type="number" min="0" id="sell" value="35" required></div></div><div class="field"><label>How many do you sell? (items)</label><input class="input" type="number" min="0" id="qty" value="10" required></div><button class="primary">Calculate</button></form><div id="moneyResult" class="result hidden" aria-live="polite"></div></div><div class="grid section"><div class="card"><div class="ico">🪙</div><h3>Save a little, when possible</h3><p>Small savings can help with unexpected costs. Choose an amount that feels possible.</p></div><div class="card"><div class="ico">🔐</div><h3>Keep money safe</h3><p>Never tell anyone your OTP, PIN or password—even if they say they can help.</p></div><div class="card"><div class="ico">📋</div><h3>Write down sales</h3><p>Record what you sell and spend. This helps you understand your business.</p></div></div></div>`}
function communityPage(){let posts=read('posts',[]);return `<div class="wrap"><h1 class="pageTitle">${tr('community')}</h1><p class="lead">A friendly space to learn from other women. Share only what you feel comfortable sharing.</p><div class="notice">🛡️ Safety rules: Do not share your phone number, home address, bank details, OTP, password or private customer information. Be kind. Report harmful posts.</div><div class="card"><h2>Share an idea or ask a question</h2><form id="postForm"><div class="field"><label>Topic</label><select class="input" name="topic"><option>My business idea</option><option>Finding customers</option><option>Learning and skills</option><option>Money basics</option><option>Encouragement</option></select></div><div class="field"><label>Your message</label><textarea name="message" maxlength="400" required placeholder="Write a question or a helpful idea…"></textarea></div><label style="display:flex;gap:8px;align-items:start;font-size:14px"><input type="checkbox" required style="margin-top:5px"> I will not share private or harmful information.</label><button class="primary" style="margin-top:14px">Share in demo community</button></form></div><div class="sectionHead section"><div><h2>Community posts</h2><p>Demo posts saved only in this browser.</p></div></div><div class="list">${posts.length?posts.map((p,i)=>`<div class="item"><div><span class="pill">${esc(p.topic)}</span><p style="color:var(--ink);font-size:17px">${esc(p.message)}</p><p>Community member · ${esc(p.date)}</p></div><button class="danger" onclick="reportPost(${i})">Report</button></div>`).join(''):'<div class="empty">No posts yet. You can start a kind conversation.</div>'}</div></div>`}
function accountPage(){let b=read('business',{}),requests=read('requests',[]);return `<div class="wrap"><h1 class="pageTitle">My account & privacy</h1><p class="lead">You are in control. Review your saved plan and choose what stays on this device.</p><div class="grid"><div class="card"><div class="ico">👤</div><h3>${esc(user?.name||'My space')}</h3><p>Signed in on this browser (demo).</p><button class="white" onclick="logout()">Sign out</button></div><div class="card"><div class="ico">📝</div><h3>My business plan</h3><p>${esc(b.idea||'You have not made a plan yet.')}</p><button class="soft" onclick="go('grow')">Continue plan →</button></div><div class="card"><div class="ico">🤝</div><h3>Mentor requests</h3><p>${requests.length} request(s) saved in this demo.</p></div></div><div class="card section"><h2>Privacy & safety settings</h2><label style="display:flex;gap:10px;align-items:center;margin:12px 0"><input type="checkbox" ${largeText?'checked':''} onchange="toggleText(this.checked)"> Use bigger text</label><button class="white" onclick="exportMyData()">Download my demo data</button> <button class="danger" onclick="deleteMyData()">Delete my data from this browser</button><div class="notice">This demo does not send your information to a server. In a real product: encrypted storage, secure sign-in, consent, access controls, data deletion, and independent safety review are required.</div></div><div class="safe"><b>Need urgent help in India?</b> Call 112 for emergencies. Women’s helpline 181 may be available in your state. Shakti Shield prototype is not a live emergency service.</div></div>`}
function safetyModal(){modal(`<h2>🛡️ Your safety matters</h2><p><b>Emergency in India: 112</b><br>Women’s helpline: 181 (availability may vary by state).</p><p>• Do not share OTP, PIN or passwords.<br>• Meet a new contact in a public place, if meeting is necessary.<br>• Tell a trusted person if you feel unsafe.<br>• Report anyone asking for money or private details in exchange for a guaranteed benefit.</p><p><b>Quick exit:</b> Tap “Quick exit” at the top to switch to a neutral page.</p><div class="safe">This is a prototype, not a monitored helpline.</div>`,'I understand')}
function quickExit(){document.title='Welcome';document.body.innerHTML='<div style="font:18px Arial;padding:10%;color:#444"><h2>Welcome</h2><p>Search the web or open a new page.</p><form action="https://www.google.com/search"><input name="q" placeholder="Search" style="padding:12px;width:70%"><button>Search</button></form></div>';history.replaceState(null,'','about:blank');}
function modal(content,close='Cancel'){ $('modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal">${content}<div class="modalfoot"><button class="white" onclick="closeModal()">${close}</button></div></div></div>`}
function closeModal(){$('modal').innerHTML=''}
function toggleText(v){largeText=typeof v==='boolean'?v:!largeText;render()}
function voiceFill(id){let Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){toast('Voice input is not available in this browser. You can type instead.');return}let rec=new Speech();rec.lang=lang==='te'?'te-IN':lang==='hi'?'hi-IN':'en-IN';rec.onresult=e=>{let el=$(id);el.value+=(el.value?' ':'')+e.results[0][0].transcript};rec.onerror=()=>toast('Could not hear clearly. Please type or try again.');rec.start();toast('Listening… speak now.')}
function bindPage(){if(page==='discover'){ $('resSearch').oninput=filterRes;$('resCat').onchange=filterRes}
if(page==='grow'){renderGrowStep();$('prevStep').onclick=()=>{collectGrow();growStep=Math.max(0,growStep-1);renderGrowStep()};$('nextStep').onclick=()=>{collectGrow();if(growStep<3){growStep++;renderGrowStep()}else{save('business',growData);fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(growData)}).then(r=>r.json()).then(x=>{if(x.ok)toast('Your business plan is saved securely.');else toast(x.error||'Plan saved locally; server save needs attention.')}).catch(()=>toast('Plan saved locally; server could not be reached.'));go('account')}}}
if(page==='money')$('moneyForm').onsubmit=e=>{e.preventDefault();let c=+$('cost').value,s=+$('sell').value,q=+$ ('qty').value;let profit=(s-c)*q;let box=$('moneyResult');box.classList.remove('hidden');box.innerHTML=`<b>Money left after product cost (estimate): ₹${profit.toLocaleString('en-IN')}</b><br>${profit>=0?'This estimate is positive. Remember to include rent, travel, electricity and your time.':'Your costs are higher than sales. You may need to review price or costs.'}`}
if(page==='community')$('postForm').onsubmit=e=>{e.preventDefault();let p=read('posts',[]);p.unshift({...Object.fromEntries(new FormData(e.target)),date:new Date().toLocaleDateString()});save('posts',p);fetch('/api/community/posts',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(p[0])}).then(r=>r.json()).then(x=>toast(x.ok?'Your post was saved.':(x.error||'Post saved locally only.'))).catch(()=>toast('Post saved locally; server unavailable.'));render()}
if(page==='login'||page==='signup')$('authForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let endpoint=page==='signup'?'/api/register':'/api/login';try{let response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(d)});let result=await response.json();if(!response.ok){toast(result.error||'Could not complete sign in.');return}user=result.user;save('session',user);page='home';render();toast(page==='signup'?'Account created securely. Welcome!':'You are signed in. Welcome!')}catch(err){toast('Cannot reach server. Keep the Python window open and try again.')}}
}
function mentorRequest(i){let m=mentors[i];modal(`<h2>Ask ${m.name} for a call</h2><form id="mentorForm"><div class="field"><label>Your name or nickname</label><input class="input" name="name" required></div><div class="field"><label>What do you want help with?</label><select class="input" name="topic"><option>Finding customers</option><option>Pricing</option><option>Money management</option><option>Digital skills</option><option>Other</option></select></div><button class="primary">Send request</button></form>`);$('mentorForm').onsubmit=e=>{e.preventDefault();let arr=read('requests',[]);arr.push({...Object.fromEntries(new FormData(e.target)),mentor:m.name,date:new Date().toLocaleDateString()});save('requests',arr);fetch('/api/mentor-requests',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({...arr[arr.length-1],mentor:m.name})}).then(r=>r.json()).then(x=>toast(x.ok?'Mentor request saved.':(x.error||'Request saved locally only.'))).catch(()=>toast('Request saved locally; server unavailable.'));closeModal()}}
function reportPost(i){let p=read('posts',[]);p.splice(i,1);save('posts',p);render();toast('Post hidden in your demo. Real platform would send to trained moderators.')}
function logout(){fetch('/api/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{});user=null;localStorage.removeItem('ss2_session');page='login';render();toast('Signed out securely.')}
function exportMyData(){let data={business:read('business',{}),requests:read('requests',[]),posts:read('posts',[])};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-shakti-shield-demo-data.json';a.click();URL.revokeObjectURL(url)}
function deleteMyData(){if(confirm('Delete your saved Shakti Shield demo data from this browser?')){Object.keys(localStorage).filter(k=>k.startsWith('ss2_')).forEach(k=>localStorage.removeItem(k));user=null;page='signup';render();toast('Demo data deleted from this browser.')}}
$('lang').onchange=e=>{lang=e.target.value;render();toast('Language changed. Some sample content remains in English.')};
user=read('session',null);page=user?'home':'login';render();
</script></body></html>
